name: agentic-web-stack-test

services:
  postgres:
    image: postgres:17
    # TEST_CONTAINER and TEST_PORT are supplied by scripts/test-db.ts — not
    # optional. Do not add `:-default` fallbacks: they would mask a missing
    # env with a silent collision on the legacy `agentic-postgres-test` name
    # or port 5433. Compose will fail loudly if either is unset, which is the
    # correct behavior.
    container_name: ${TEST_CONTAINER}
    environment:
      POSTGRES_DB: agentic_web_stack_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 15
