name: agentic-web-stack-test

services:
  postgres:
    image: postgres:17
    # TEST_CONTAINER, TEST_PORT supplied by scripts/test-db.ts.
    container_name: ${TEST_CONTAINER}
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TEST_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - wal_level=minimal
      - -c
      - max_wal_senders=0
      - -c
      - shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: ${TEST_REDIS_CONTAINER}
    ports:
      - "${TEST_REDIS_PORT}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 15

  mailpit:
    image: axllent/mailpit
    container_name: ${TEST_MAILPIT_CONTAINER}
    ports:
      - "${TEST_MAILPIT_SMTP_PORT}:1025"
      - "${TEST_MAILPIT_HTTP_PORT}:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/api/v1/info || exit 1"]
      interval: 1s
      timeout: 1s
      retries: 15
